name: Сборка APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      SRC: ${{ github.workspace }}/_src/riviera-reader

    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Распаковать проект
        run: |
          set -e
          unzip -q riviera-reader.zip -d _src
          # В ридере arm64; вторая архитектура только раздувает APK вдвое.
          sed -i "s/abiFilters 'arm64-v8a', 'armeabi-v7a'/abiFilters 'arm64-v8a'/" "$SRC/android/app/build.gradle"
          grep -n abiFilters "$SRC/android/app/build.gradle"

      - name: Поставить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Поставить NDK и CMake
        run: |
          set -e
          if ! command -v sdkmanager > /dev/null; then
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
            echo "PATH=$PATH" >> "$GITHUB_ENV"
          fi
          command -v sdkmanager
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Кэш ключа подписи
        uses: actions/cache@v4
        with:
          path: .keystore
          key: riviera-keystore-v1

      - name: Ключ подписи
        run: |
          set -e
          KS="$SRC/android/riviera-release.keystore"
          SAVED="$GITHUB_WORKSPACE/.keystore/riviera-release.keystore"
          mkdir -p "$GITHUB_WORKSPACE/.keystore"
          if [ -n "${{ secrets.KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$SAVED"
            echo "ключ взят из секрета репозитория"
          elif [ -s "$SAVED" ]; then
            echo "ключ восстановлен из кэша сборки"
          else
            keytool -genkeypair -v -keystore "$SAVED" -storepass riviera -keypass riviera -alias riviera -keyalg RSA -keysize 4096 -validity 10950 -dname "CN=Riviera Reader, OU=Personal, O=Riviera, C=RU"
            echo "ключа не было нигде, создан новый"
          fi
          cp "$SAVED" "$KS"
          base64 -w0 "$SAVED" > "$GITHUB_WORKSPACE/keystore.b64"
          keytool -list -v -keystore "$KS" -storepass riviera | grep -E "SHA256:|Valid from" | head -2

      - name: Кэш зависимостей движка
        uses: actions/cache@v4
        with:
          path: |
            _src/riviera-reader/thirdparty
            _src/riviera-reader/thirdparty_tmp
          key: crengine-thirdparty-v1

      - name: Зависимости движка
        run: |
          set -e
          cd "$SRC"
          chmod +x thirdparty-deploy.sh
          ./thirdparty-deploy.sh

      - name: Шрифты
        run: |
          set -e
          cd "$SRC"
          chmod +x fetch-fonts.sh
          ./fetch-fonts.sh

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-riviera-v1

      - name: Собрать APK
        run: |
          set -e
          cd "$SRC/android"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease --stacktrace

      - name: Что получилось
        if: always()
        run: find "$SRC/android" -name "*.apk" -exec ls -lh {} + || true

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: riviera-reader-apk
          path: _src/riviera-reader/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Опубликовать релиз с APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=$(find "$SRC/android/app/build/outputs/apk/release" -name "*.apk" | head -1)
          cp "$APK" "$GITHUB_WORKSPACE/riviera-reader.apk"
          ls -lh "$GITHUB_WORKSPACE/riviera-reader.apk"
          gh release create "build-${{ github.run_number }}" "$GITHUB_WORKSPACE/riviera-reader.apk" \
            --title "Сборка ${{ github.run_number }}" \
            --notes "Riviera Reader для ViWoods AiPaper Reader C, arm64." \
            --latest

      - name: Выложить ключ подписи
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: keystore.b64
          if-no-files-found: ignore
